schema_version: "0.1.0"

registry_version: "0.1.0"

organization_id: org_main

name: AI Organization Agent Registry

description: >
  Canonical registry of reusable Agent Definitions and organizational
  capabilities. The Registry supports capability-based routing and does
  not imply that registered Agents are continuously active.

status: active


# ---------------------------------------------------------------------------
# CAPABILITY CATALOG
# ---------------------------------------------------------------------------

capabilities:

  # Orchestration

  - id: orchestration.task_decomposition
    description: Decompose Objectives and Decisions into bounded Tasks.

  - id: orchestration.task_routing
    description: Route Tasks according to capabilities, authority and context.

  - id: orchestration.workflow_coordination
    description: Coordinate execution across Workflow states and dependencies.

  - id: orchestration.escalation
    description: Detect and route unresolved execution or authority problems.


  # Organization architecture

  - id: organization.agent_design
    description: Design and revise Agent Definitions.

  - id: organization.workflow_design
    description: Design organizational Workflows.

  - id: organization.policy_analysis
    description: Analyze governance and Policy architecture.

  - id: organization.system_evaluation
    description: Analyze organizational performance and coordination structure.


  # Strategy

  - id: strategy.product
    description: Define and assess Product strategy.

  - id: strategy.business
    description: Analyze business strategy and competitive positioning.

  - id: strategy.scenario_analysis
    description: Evaluate strategic scenarios and trade-offs.

  - id: strategy.opportunity_assessment
    description: Assess whether an opportunity merits further investment.


  # Market

  - id: market.research
    description: Research markets and relevant external information.

  - id: market.segmentation
    description: Segment markets and identify relevant customer categories.

  - id: market.sizing
    description: Estimate market size and relevant opportunity ranges.

  - id: competitor.analysis
    description: Identify and analyze competitors and substitutes.


  # Customer

  - id: customer.research
    description: Conduct or analyze qualitative customer research.

  - id: customer.problem_validation
    description: Assess whether proposed customer problems are materially real.

  - id: customer.voice_analysis
    description: Synthesize Voice-of-Customer information.

  - id: customer.experiment_design
    description: Design customer-facing validation experiments.


  # Product

  - id: product.requirements
    description: Convert strategy into explicit product requirements.

  - id: product.prioritization
    description: Prioritize product work under constraints.

  - id: product.roadmapping
    description: Create and maintain product roadmaps.

  - id: product.experimentation
    description: Define product hypotheses and validation experiments.


  # Design

  - id: design.user_flow
    description: Design user flows and interaction structure.

  - id: design.prototype
    description: Produce prototype and interface specifications.

  - id: design.usability
    description: Analyze usability and interaction risks.


  # Finance / Business

  - id: finance.unit_economics
    description: Analyze CAC, LTV, margins and unit economics.

  - id: finance.pricing
    description: Analyze pricing alternatives and economics.

  - id: finance.scenario_modeling
    description: Produce financial scenarios and sensitivity analysis.

  - id: business.model_analysis
    description: Analyze business model viability and operating structure.


  # Evidence

  - id: evidence.verification
    description: Verify material Claims against Evidence.

  - id: evidence.quality_assessment
    description: Assess provenance, independence and Evidence quality.

  - id: evidence.gap_analysis
    description: Identify material unsupported Claims and Evidence gaps.

  - id: evidence.synthesis
    description: Synthesize supporting and contradictory Evidence.


  # Adversarial review

  - id: redteam.thesis_review
    description: Attempt to falsify strategic or product theses.

  - id: redteam.assumption_attack
    description: Identify hidden or fragile assumptions.

  - id: redteam.failure_analysis
    description: Identify plausible failure modes and neglected alternatives.


  # Architecture

  - id: architecture.system_design
    description: Design software architecture and system boundaries.

  - id: architecture.adr
    description: Produce Architecture Decision Records.

  - id: architecture.data_model
    description: Design logical data architecture.

  - id: architecture.integration
    description: Design APIs and system integrations.


  # Engineering

  - id: engineering.implementation
    description: Implement software changes.

  - id: engineering.backend
    description: Implement backend services and APIs.

  - id: engineering.frontend
    description: Implement client-facing application components.

  - id: engineering.testing
    description: Create and execute software tests.

  - id: engineering.refactoring
    description: Improve existing implementation without changing intended behavior.


  # AI

  - id: ai.agent_design
    description: Design AI agent and orchestration implementation.

  - id: ai.rag
    description: Design retrieval-augmented generation systems.

  - id: ai.context_engineering
    description: Design model context and retrieval strategies.

  - id: ai.evaluation
    description: Design AI-specific evaluation systems.

  - id: ai.model_routing
    description: Analyze model selection and routing strategies.


  # Security / privacy / risk

  - id: security.architecture
    description: Analyze application and infrastructure security.

  - id: security.threat_modeling
    description: Identify threats and required mitigations.

  - id: privacy.analysis
    description: Assess privacy and data-handling implications.

  - id: risk.analysis
    description: Assess operational and organizational risk.

  - id: compliance.analysis
    description: Perform preliminary compliance analysis.

  - id: regulatory.triage
    description: Detect when specialized regulatory expertise is required.


  # Growth

  - id: growth.strategy
    description: Design acquisition, activation, retention and revenue strategy.

  - id: growth.positioning
    description: Define ICP, positioning and product marketing.

  - id: growth.content
    description: Produce or plan marketing communication and content.

  - id: growth.sales
    description: Analyze sales strategy and funnel design.

  - id: growth.retention
    description: Analyze customer success, retention and expansion.


  # Data / decision science

  - id: data.analysis
    description: Analyze organizational or product data.

  - id: data.metrics
    description: Define and interpret metrics.

  - id: data.product_analytics
    description: Analyze product behavior and usage.

  - id: decision.analysis
    description: Transform data and Evidence into decision support.

  - id: experiment.analysis
    description: Analyze experimental results.


# ---------------------------------------------------------------------------
# AGENT REGISTRY
# ---------------------------------------------------------------------------

agents:

  - id: agent_orchestrator
    name: Orchestrator
    class: core
    status: active
    contract_ref: agents/contracts/orchestrator.yaml

    capabilities:
      - orchestration.task_decomposition
      - orchestration.task_routing
      - orchestration.workflow_coordination
      - orchestration.escalation

    activation:
      default: workflow_or_task_driven


  - id: agent_ai_organization_architect
