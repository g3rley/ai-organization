$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ai-organization.local/schemas/decision.schema.yaml"

title: Decision
description: >
  Canonical representation of an organizational decision.
  A Decision records a committed or proposed choice between alternatives
  and the authority, evidence, rationale and review conditions associated
  with that choice.

type: object
additionalProperties: false

required:
  - schema_version
  - id
  - organization_id
  - scope
  - title
  - question
  - decision_type
  - status
  - proposed_by
  - options
  - authority
  - impact
  - reversibility
  - created_at

properties:

  schema_version:
    type: string
    const: "0.1.0"

  id:
    type: string
    pattern: "^dec_[A-Za-z0-9_-]+$"
    description: Stable unique identifier for this decision.

  organization_id:
    type: string
    pattern: "^org_[A-Za-z0-9_-]+$"

  project_id:
    type: string
    pattern: "^proj_[A-Za-z0-9_-]+$"

  scope:
    type: string
    enum:
      - organization
      - project

  title:
    type: string
    minLength: 1
    maxLength: 300

  question:
    type: string
    minLength: 1
    maxLength: 3000
    description: >
      The explicit decision question that must be resolved.

  decision_type:
    type: string
    enum:
      - strategic
      - product
      - technical
      - financial
      - operational
      - security
      - privacy
      - regulatory
      - governance
      - go_no_go
      - other

  status:
    type: string
    enum:
      - proposed
      - under_review
      - committed
      - rejected
      - superseded

  proposed_by:
    $ref: "#/$defs/actor"

  decision_owner:
    $ref: "#/$defs/actor"

  options:
    type: array
    minItems: 2
    items:
      $ref: "#/$defs/option"

  selected_option_id:
    type: string
    pattern: "^opt_[A-Za-z0-9_-]+$"
    description: >
      Identifier of the selected option after the decision is committed.

  rationale:
    type: string
    maxLength: 10000
    description: >
      Explanation of why the selected option was chosen.

  inputs:
    $ref: "#/$defs/decision_inputs"

  objections:
    type: array
    items:
      $ref: "#/$defs/objection"
    default: []

  authority:
    $ref: "#/$defs/authority"

  approvals:
    type: array
    items:
      $ref: "#/$defs/approval"
    default: []

  impact:
    $ref: "#/$defs/impact"

  reversibility:
    $ref: "#/$defs/reversibility"

  confidence:
    type: number
    minimum: 0
    maximum: 1
    description: >
      Confidence in the decision given current evidence.
      Confidence is not a substitute for evidence.

  assumptions:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 3000
    default: []

  unresolved_questions:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 3000
    default: []

  review:
    $ref: "#/$defs/review"

  supersedes_decision_id:
    type: string
    pattern: "^dec_[A-Za-z0-9_-]+$"

  created_at:
    type: string
    format: date-time

  committed_at:
    type: string
    format: date-time

  superseded_at:
    type: string
    format: date-time

  tags:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 100
    default: []

  metadata:
    type: object
    additionalProperties: true
    default: {}

allOf:

  - if:
      properties:
        scope:
          const: project
    then:
      required:
        - project_id

  - if:
      properties:
        status:
          const: committed
    then:
      required:
        - selected_option_id
        - rationale
        - decision_owner
        - committed_at

  - if:
      properties:
        status:
          const: superseded
    then:
      required:
        - superseded_at

$defs:

  actor:
    type: object
    additionalProperties: false

    required:
      - actor_type
      - actor_id

    properties:

      actor_type:
        type: string
        enum:
          - human
          - agent
          - workflow
          - system

      actor_id:
        type: string
        minLength: 1
        maxLength: 300

      display_name:
        type: string
        maxLength: 300

  option:
    type: object
    additionalProperties: false

    required:
      - id
      - label

    properties:

      id:
        type: string
        pattern: "^opt_[A-Za-z0-9_-]+$"

      label:
        type: string
        minLength: 1
        maxLength: 300

      description:
        type: string
        maxLength: 5000

      expected_benefits:
        type: array
        items:
          type: string
        default: []

      expected_costs:
        type: array
        items:
          type: string
        default: []

      risks:
        type: array
        items:
          type: string
        default: []

  decision_inputs:
    type: object
    additionalProperties: false

    properties:

      artifact_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^art_[A-Za-z0-9_-]+$"
        default: []

      claim_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^claim_[A-Za-z0-9_-]+$"
        default: []

      evidence_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^evd_[A-Za-z0-9_-]+$"
        default: []

      prior_decision_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^dec_[A-Za-z0-9_-]+$"
        default: []

  objection:
    type: object
    additionalProperties: false

    required:
      - raised_by
      - statement
      - status

    properties:

      raised_by:
        $ref: "#/$defs/actor"

      statement:
        type: string
        minLength: 1
        maxLength: 5000

      supporting_artifact_id:
        type: string
        pattern: "^art_[A-Za-z0-9_-]+$"

      status:
        type: string
        enum:
          - open
          - addressed
          - accepted
          - rejected
          - waived

      resolution:
        type: string
        maxLength: 5000

  authority:
    type: object
    additionalProperties: false

    required:
      - decision_mode

    properties:

      decision_mode:
        type: string
        enum:
          - delegated
          - peer_review
          - consensus
          - majority_vote
          - weighted_vote
          - policy_rule
          - arbitration
          - human_approval

      authority_source:
        type: string
        maxLength: 1000
        description: >
          Policy, agent contract, project delegation or human instruction
          granting authority for this decision.

      required_approvals:
        type: integer
        minimum: 0

      human_approval_required:
        type: boolean
        default: false

      veto_roles:
        type: array
        uniqueItems: true
        items:
          type: string
        default: []

  approval:
    type: object
    additionalProperties: false

    required:
      - actor
      - verdict
      - decided_at

    properties:

      actor:
        $ref: "#/$defs/actor"

      verdict:
        type: string
        enum:
          - approve
          - reject
          - abstain

      rationale:
        type: string
        maxLength: 5000

      decided_at:
        type: string
        format: date-time

  impact:
    type: object
    additionalProperties: false

    required:
      - level

    properties:

      level:
        type: string
        enum:
          - low
          - medium
          - high
          - critical

      domains:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
            - financial
            - strategic
            - product
            - technical
            - operational
            - legal
            - regulatory
            - privacy
            - security
            - safety
            - reputational

      notes:
        type: array
        items:
          type: string

  reversibility:
    type: object
    additionalProperties: false

    required:
      - level

    properties:

      level:
        type: string
        enum:
          - easily_reversible
          - reversible_with_cost
          - difficult_to_reverse
          - effectively_irreversible

      estimated_reversal_cost:
        type: string
        maxLength: 2000

      rollback_available:
        type: boolean

  review:
    type: object
    additionalProperties: false

    properties:

      review_required:
        type: boolean
        default: false

      review_at:
        type: string
        format: date-time

      review_after_days:
        type: integer
        minimum: 1

      triggers:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 2000

      success_metrics:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 2000