$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ai-organization.local/schemas/artifact.schema.yaml"

title: Artifact
description: >
  Canonical envelope for a persistent organizational work product.
  An Artifact identifies, versions and relates a work product independently
  from the model, agent, conversation or storage system that created it.

type: object
additionalProperties: false

required:
  - schema_version
  - id
  - logical_id
  - organization_id
  - scope
  - artifact_type
  - title
  - revision
  - status
  - created_by
  - created_at
  - content

properties:

  schema_version:
    type: string
    const: "0.1.0"

  id:
    type: string
    pattern: "^art_[A-Za-z0-9_-]+$"
    description: >
      Unique identifier for this specific artifact revision.

  logical_id:
    type: string
    pattern: "^artifact_[A-Za-z0-9_-]+$"
    description: >
      Stable identity shared by all revisions of the same logical artifact.

  organization_id:
    type: string
    pattern: "^org_[A-Za-z0-9_-]+$"

  project_id:
    type: string
    pattern: "^proj_[A-Za-z0-9_-]+$"

  scope:
    type: string
    enum:
      - organization
      - project

  artifact_type:
    type: string
    minLength: 1
    maxLength: 200
    pattern: "^[a-z][a-z0-9_.-]*$"
    description: >
      Namespaced semantic type of the artifact.
      Examples: product.prd, architecture.adr, research.market_report,
      finance.unit_economics, engineering.code_change.

  title:
    type: string
    minLength: 1
    maxLength: 300

  description:
    type: string
    maxLength: 5000

  revision:
    type: integer
    minimum: 1
    description: >
      Monotonically increasing revision number for this logical artifact.

  status:
    type: string
    enum:
      - draft
      - in_review
      - approved
      - rejected
      - superseded
      - archived

  created_by:
    $ref: "#/$defs/actor"

  created_from_run_id:
    type: string
    pattern: "^run_[A-Za-z0-9_-]+$"
    description: >
      Optional execution run responsible for producing this revision.

  created_at:
    type: string
    format: date-time

  updated_at:
    type: string
    format: date-time

  content:
    $ref: "#/$defs/content"

  provenance:
    $ref: "#/$defs/provenance"

  links:
    type: array
    description: >
      Typed relationships between this artifact and other canonical entities.
    items:
      $ref: "#/$defs/link"
    default: []

  tags:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 100
    default: []

  metadata:
    type: object
    description: >
      Optional non-canonical extension metadata.
      Core organizational logic must not depend on undocumented fields here.
    additionalProperties: true
    default: {}

allOf:

  - if:
      properties:
        scope:
          const: project

    then:
      required:
        - project_id

$defs:

  actor:
    type: object
    additionalProperties: false

    required:
      - actor_type
      - actor_id

    properties:

      actor_type:
        type: string
        enum:
          - human
          - agent
          - workflow
          - system
          - tool

      actor_id:
        type: string
        minLength: 1
        maxLength: 300

      display_name:
        type: string
        maxLength: 300

  content:
    type: object
    additionalProperties: false

    required:
      - mode
      - media_type

    properties:

      mode:
        type: string
        enum:
          - inline
          - reference

      media_type:
        type: string
        minLength: 1
        description: >
          MIME media type such as text/markdown,
          application/json or application/pdf.

      schema_ref:
        type: string
        description: >
          Optional schema identifier describing the structure
          of the artifact payload.

      body:
        description: >
          Inline content. Intended for reasonably small structured
          or textual artifacts.

      uri:
        type: string
        description: >
          Location of externally stored artifact content.

      checksum:
        type: string
        pattern: "^sha256:[A-Fa-f0-9]{64}$"
        description: >
          Optional SHA-256 digest of the artifact content.

    allOf:

      - if:
          properties:
            mode:
              const: inline

        then:
          required:
            - body

      - if:
          properties:
            mode:
              const: reference

        then:
          required:
            - uri

  provenance:
    type: object
    additionalProperties: false

    properties:

      source_type:
        type: string
        enum:
          - original
          - derived
          - imported
          - generated
          - transformed

      source_description:
        type: string
        maxLength: 3000

      source_uris:
        type: array
        items:
          type: string

      generated_by_model:
        type: object
        additionalProperties: false

        properties:

          provider:
            type: string

          model:
            type: string

          model_version:
            type: string

  link:
    type: object
    additionalProperties: false

    required:
      - relation
      - target_type
      - target_id

    properties:

      relation:
        type: string
        enum:
          - derived_from
          - supersedes
          - references
          - reviews
          - implements
          - supports
          - contradicts
          - produced_for
          - depends_on
          - related_to

      target_type:
        type: string
        enum:
          - artifact
          - project
          - objective
          - task
          - run
          - claim
          - evidence
          - decision
          - event
          - memory

      target_id:
        type: string
        minLength: 1

      note:
        type: string
        maxLength: 1000