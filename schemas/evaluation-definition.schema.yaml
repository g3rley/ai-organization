$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ai-organization.local/schemas/evaluation-definition.schema.yaml"

title: Evaluation Definition

description: >
  Canonical versioned definition describing how a class of organizational
  targets should be evaluated. Evaluation Definitions specify criteria,
  methods, scoring and verdict rules. Concrete results are stored as
  Evaluation entities.

type: object
additionalProperties: false

required:
  - schema_version
  - id
  - version
  - name
  - status
  - target
  - evaluation_kind
  - method
  - criteria
  - scoring
  - verdict_policy

properties:

  schema_version:
    type: string
    const: "0.1.0"

  id:
    type: string
    pattern: "^evaldef_[A-Za-z0-9_-]+$"

  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"

  name:
    type: string
    minLength: 1
    maxLength: 300

  description:
    type: string
    maxLength: 5000

  status:
    type: string
    enum:
      - draft
      - active
      - deprecated
      - disabled

  target:
    $ref: "#/$defs/target"

  evaluation_kind:
    type: string
    enum:
      - validity
      - quality
      - safety
      - compliance
      - performance
      - outcome
      - comparative
      - other

  method:
    type: string
    enum:
      - deterministic
      - model_based
      - human
      - outcome_based
      - mixed

  evaluator_requirements:
    $ref: "#/$defs/evaluator_requirements"

  criteria:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/criterion"

  scoring:
    $ref: "#/$defs/scoring"

  verdict_policy:
    $ref: "#/$defs/verdict_policy"

  policy_refs:
    type: array
    uniqueItems: true
    items:
      type: string
    default: []

  created_at:
    type: string
    format: date-time

  updated_at:
    type: string
    format: date-time

  tags:
    type: array
    uniqueItems: true
    items:
      type: string
    default: []

  metadata:
    type: object
    additionalProperties: true
    default: {}

$defs:

  target:
    type: object
    additionalProperties: false

    required:
      - target_type

    properties:

      target_type:
        type: string
        enum:
          - artifact
          - run
          - decision
          - agent_definition
          - workflow_definition

      artifact_type:
        type: string
        pattern: "^[a-z][a-z0-9_.-]*$"

      target_schema_ref:
        type: string

  evaluator_requirements:
    type: object
    additionalProperties: false

    properties:

      minimum_independence:
        type: string
        enum:
          - self_assessment
          - same_agent_independent_run
          - independent_agent
          - independent_model_family
          - human_independent
          - deterministic
          - not_applicable

      preferred_independence:
        type: string
        enum:
          - self_assessment
          - same_agent_independent_run
          - independent_agent
          - independent_model_family
          - human_independent
          - deterministic
          - not_applicable

      required_capabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z][a-z0-9_.-]*$"
        default: []

      notes:
        type: string
        maxLength: 3000

  criterion:
    type: object
    additionalProperties: false

    required:
      - id
      - name
      - method
      - weight

    properties:

      id:
        type: string
        pattern: "^criterion_[A-Za-z0-9_.-]+$"

      name:
        type: string
        minLength: 1
        maxLength: 300

      description:
        type: string
        maxLength: 5000

      method:
        type: string
        enum:
          - deterministic
          - model_based
          - human
          - outcome_based

      weight:
        type: number
        minimum: 0
        maximum: 1

      blocking:
        type: boolean
        default: false
        description: >
          A failed blocking criterion may force the overall Evaluation
          to fail regardless of aggregate score.

      deterministic_check:
        $ref: "#/$defs/deterministic_check"

      rubric:
        $ref: "#/$defs/rubric"

      supporting_refs_required:
        type: boolean
        default: false

  deterministic_check:
    type: object
    additionalProperties: false

    required:
      - check_type

    properties:

      check_type:
        type: string
        enum:
          - schema_validity
          - reference_integrity
          - required_field_presence
          - material_claim_accounting
          - claim_scope_coverage
          - threshold
          - completion_criteria
          - custom

      configuration:
        type: object
        additionalProperties: true
        default: {}

  rubric:
    type: object
    additionalProperties: false

    properties:

      question:
        type: string
        maxLength: 5000

      pass_description:
        type: string
        maxLength: 5000

      partial_description:
        type: string
        maxLength: 5000

      fail_description:
        type: string
        maxLength: 5000

      evaluator_instructions:
        type: array
        items:
          type: string
          maxLength: 3000
        default: []

  scoring:
    type: object
    additionalProperties: false

    required:
      - aggregation

    properties:

      aggregation:
        type: string
        enum:
          - weighted_mean
          - minimum
          - unweighted_mean
          - custom

      normalize_applicable_weights:
        type: boolean
        default: true

      minimum_score:
        type: number
        minimum: 0
        maximum: 1

  verdict_policy:
    type: object
    additionalProperties: false

    required:
      - pass_minimum_score
      - needs_revision_minimum_score
      - blocking_failure_verdict

    properties:

      pass_minimum_score:
        type: number
        minimum: 0
        maximum: 1

      needs_revision_minimum_score:
        type: number
        minimum: 0
        maximum: 1

      blocking_failure_verdict:
        type: string
        enum:
          - fail
          - needs_revision

      inconclusive_on_missing_required_evidence:
        type: boolean
        default: true